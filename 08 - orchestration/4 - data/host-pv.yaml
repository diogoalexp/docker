apiVersion: v1
kind: PersistentVolume
metadata:
  name: host-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem # Filesystem | Block
  accessModes:
    - ReadWriteOnce # ReadWriteOnce | ReadOnlyMany | ReadWriteMany
  # persistentVolumeReclaimPolicy: Recycle
  storageClassName: standard # kubectl get sc
  # mountOptions:
  #   - hard
  #   - nfsvers=4.1
  # nfs:
  #   path: /tmp
  #   server: 172.17.0.2
  #--
  hostPath:
    path: /data
    type: DirectoryOrCreate
